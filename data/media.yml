# Media items, newest first within each type. The Media page groups them by `type`;
# items with `featured: true` also appear in the home-page carousel.
#
# Fields
#   type:        opinion | podcast | news | brief
#   title, outlet, date (YYYY-MM-DD, or YYYY-MM-01 when only the month is known), date_label
#   link:        the piece itself (prefer the original outlet)
#   authors:     for co-written pieces
#   note:        optional line (e.g. "Republished by Fortune")
#   image:       card image (generated by scripts/make_thumbnails.py from outlet + type)
#   outlet_short: optional shorter outlet name for the card image
#   featured, summary: carousel fields

# ---------------- Opinion & commentary ----------------
- id: conversation-2026-equalizer
  type: opinion
  title: "Are schools a great equalizer? They help kids catch up, but wealthier children still pull ahead"
  outlet: "The Conversation"
  date: 2026-11-04
  date_label: "November 2026"
  link: "https://fortune.com/2026/11/04/richest-families-outspend-poorest-13-to-1-per-child-schools-equalizer/"
  note: "Republished by Fortune and others"
  image: images/media/conversation-2026-equalizer.svg
  featured: true
  summary: "Schools help children catch up, but the gaps that open before kindergarten in housing and child care can't be left to schools alone."

- id: hill-2026-budget-lines
  type: opinion
  title: "Congress debates childhood by budget lines. Children don’t live that way."
  outlet: "The Hill"
  authors: "Blazar, D., & Boudreaux, M."
  date: 2026-08-01
  date_label: "August 2026"
  link: "https://thehill.com/opinion/congress-blog/economy-budget/6017347-childhood-investment-gap-analysis/"
  image: images/media/hill-2026-budget-lines.svg
  featured: true
  summary: "A child’s well-being is shaped by education, health care, housing, nutrition and family resources together. Budgets should see it that way."

