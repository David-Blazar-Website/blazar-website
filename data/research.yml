# Research items: one entry per paper. The Research page lists them in file order
# (working papers first, then published articles newest first). Items with `featured: true`
# also appear in the home-page carousel.
#
# Fields
#   status:      working | published
#   title, authors (APA author string), year, journal, volume, issue, pages
#   online:      true for "Advance online publication" (no volume/issue yet)
#   link:        journal version (DOI) for published papers; public version (e.g. EdWorkingPapers) for working papers
#   open_access: true if the journal version is free to read (Creative Commons license)
#   free_link, free_label: free version posted elsewhere, and where (rule b in DECISIONS.md)
#   manuscript:  path to an accepted manuscript hosted in files/papers/ (rule c)
#   related:     commentary, briefs or podcasts about this study: [{label, link}] (shown as "Related" links;
#                the same pieces are listed on the Media page)
#   note:        optional line under the citation (awards, coverage)
#   topic:       icon theme used by scripts/make_thumbnails.py when there is no `finding`
#   finding:     key-finding visual from the paper's own numbers: bars (title, unit, bars: [[label, value]], note)
#                or a stat card (kind: stat, value, caption)
#   image:       thumbnail path (generated by scripts/make_thumbnails.py)
#   featured, date, summary: carousel fields (date as YYYY-MM-DD; summary is one sentence)

