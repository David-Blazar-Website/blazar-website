<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#EAEAE6"/><text x="36" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F2421">Multi-cohort experiments</text><rect x="36" y="92" width="64" height="6" rx="3" fill="#4D5450"/><rect x="40" y="140" width="7" height="66" rx="3" fill="#4D5450"/><text x="62" y="164" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">Rigor: random assignment in each</text><text x="62" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">cohort</text><rect x="40" y="230" width="7" height="66" rx="3" fill="#4D5450"/><text x="62" y="254" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">Replication: three cohorts of the</text><text x="62" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">same coaching program</text><rect x="40" y="320" width="7" height="66" rx="3" fill="#4D5450"/><text x="62" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">Relevance: changes in coaches,</text><text x="62" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">content and duration coincided with</text></svg>