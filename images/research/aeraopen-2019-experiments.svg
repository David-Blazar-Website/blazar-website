<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#EAEAE6"/><text x="48" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#4D5450">RESEARCH DESIGN</text><text x="48" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1F2421">Multi-cohort, longitudinal</text><text x="48" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1F2421">experiments</text><rect x="48" y="222" width="8" height="29" rx="3" fill="#4D5450"/><text x="76" y="244" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Rigor: random assignment in each cohort</text><rect x="48" y="273" width="8" height="68" rx="3" fill="#4D5450"/><text x="76" y="295" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Replication: three cohorts of the same</text><text x="76" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">coaching program</text><rect x="48" y="363" width="8" height="68" rx="3" fill="#4D5450"/><text x="76" y="385" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Relevance: changes in coaches, content and</text><text x="76" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">duration coincided with different effects</text></svg>