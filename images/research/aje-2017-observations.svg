<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#ECE6EF"/><text x="48" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#6A4C7A">CLASSROOM OBSERVATION</text><text x="44" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="700" fill="#6A4C7A">−0.05 to 0.13</text><text x="48" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">Range across five districts in how strongly</text><text x="48" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">observed ambitious math instruction predicted</text><text x="48" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">state test scores. The link was significant in</text><text x="48" y="434" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">only two.</text></svg>