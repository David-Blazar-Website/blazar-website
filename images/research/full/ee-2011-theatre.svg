<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#F1E7DB"/><text x="48" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#8A5A35">TEACHING ENGLISH</text><text x="44" y="200" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="88" fill="#8A5A35">In the Heights</text><text x="48" y="325" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">A unit built around the Broadway musical helped</text><text x="48" y="362" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">a new teacher and his Washington Heights</text><text x="48" y="399" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">students explore cultural identity through</text><text x="48" y="436" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">performance.</text></svg>