<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#FAF6EF"/><text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#1F2421">Effect of taking a high-quality high school</text><text x="40" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#1F2421">CS course</text><text x="333.8" y="232.0" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">Declaring a CS major</text><path d="M349.8 200.0 h316.2 a4 4 0 0 1 4 4 v38 a4 4 0 0 1 -4 4 h-316.2 Z" fill="#9C4A2C"/><text x="682.0" y="233.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2421">10.2 pts</text><text x="333.8" y="378.0" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">Earning a CS bachelor&#x27;s</text><path d="M349.8 346.0 h168.65686274509804 a4 4 0 0 1 4 4 v38 a4 4 0 0 1 -4 4 h-168.65686274509804 Z" fill="#6B6B6B"/><text x="534.4568627450981" y="379.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2421">5.5 pts</text><line x1="349.8" y1="144" x2="349.8" y2="446" stroke="#6B6B6B" stroke-opacity="0.5" stroke-width="2"/><text x="40" y="478" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#6B6B6B">Percentage points. Exposure also raised earnings at age 24 by about 8%.</text></svg>