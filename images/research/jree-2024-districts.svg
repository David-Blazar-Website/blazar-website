<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#E3E9EE"/><text x="48" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#46617A">SCHOOL DISTRICTS</text><text x="48" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1F2421">District policies linked to</text><text x="48" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1F2421">better student outcomes</text><rect x="48" y="222" width="8" height="29" rx="3" fill="#46617A"/><text x="76" y="244" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Higher teacher salaries</text><rect x="48" y="273" width="8" height="29" rx="3" fill="#46617A"/><text x="76" y="295" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Data use</text><rect x="48" y="324" width="8" height="68" rx="3" fill="#46617A"/><text x="76" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">School autonomy and parental choice in</text><text x="76" y="385" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">district-wide turnarounds</text></svg>