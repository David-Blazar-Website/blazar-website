<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#FAF6EF"/><text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#1F2421">Investment gap between the richest and</text><text x="40" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#1F2421">poorest quarter of families</text><text x="254" y="232.0" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">Before age 5</text><path d="M270 200.0 h396.0 a4 4 0 0 1 4 4 v38 a4 4 0 0 1 -4 4 h-396.0 Z" fill="#5E5145"/><text x="682.0" y="233.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2421">24%</text><text x="254" y="378.0" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#1F2421">Age 5 to grade 12</text><path d="M270 346.0 h196.0 a4 4 0 0 1 4 4 v38 a4 4 0 0 1 -4 4 h-196.0 Z" fill="#5E5145"/><text x="482.0" y="379.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2421">12%</text><line x1="270" y1="144" x2="270" y2="446" stroke="#6B6B6B" stroke-opacity="0.5" stroke-width="2"/><text x="40" y="478" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#6B6B6B">Total investment in children, including public, private and family time.</text></svg>