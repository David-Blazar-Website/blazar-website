<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" role="img"><rect width="600" height="1000" fill="#FAF6EF"/><text x="40" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#1F2421">Investment gap between</text><text x="40" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#1F2421">children in the poorest and</text><text x="40" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#1F2421">richest quarter of families</text><text x="40" y="442" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">Birth to age 5</text><path d="M40 456.0 h406.0 a4 4 0 0 1 4 4 v44.0 a4 4 0 0 1 -4 4 h-406.0 Z" fill="#5E5145"/><text x="464.0" y="493.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2421">24%</text><text x="40" y="592" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">Ages 5 to 18</text><path d="M40 606.0 h201.0 a4 4 0 0 1 4 4 v44.0 a4 4 0 0 1 -4 4 h-201.0 Z" fill="#5E5145"/><text x="259.0" y="643.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2421">12%</text><text x="40" y="932" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#6B6B6B">Total public, private and family-time</text><text x="40" y="960" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#6B6B6B">investment, bottom vs. top income quartile.</text></svg>