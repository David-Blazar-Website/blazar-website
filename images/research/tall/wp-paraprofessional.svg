<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" role="img"><rect width="600" height="1000" fill="#E6ECE4"/><text x="48" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#4F6B52">TEACHER PIPELINE</text><text x="44" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="106" font-weight="700" fill="#4F6B52">1 in 3–4</text><text x="48" y="510.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">Schools lose roughly one aide</text><text x="48" y="548.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">position for every three to four</text><text x="48" y="586.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">aides who become teachers</text></svg>