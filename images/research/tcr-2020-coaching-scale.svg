<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#E4EAF0"/><text x="48" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#3E5C76">COACHING &amp; DEVELOPMENT</text><text x="48" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1F2421">Coaching at scale</text><rect x="48" y="174" width="8" height="68" rx="3" fill="#3E5C76"/><text x="76" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Coaches can help teachers and also build</text><text x="76" y="235" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">leadership capacity in their systems</text><rect x="48" y="264" width="8" height="68" rx="3" fill="#3E5C76"/><text x="76" y="286" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Top-down hierarchies and competing reforms</text><text x="76" y="325" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">can get in the way</text><rect x="48" y="354" width="8" height="68" rx="3" fill="#3E5C76"/><text x="76" y="376" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">Key question: what skills coaches need to</text><text x="76" y="415" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="31" fill="#1F2421">do both</text></svg>