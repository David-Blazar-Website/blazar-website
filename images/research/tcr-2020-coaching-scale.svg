<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#E4EAF0"/><text x="36" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1F2421">Coaching at scale</text><rect x="36" y="92" width="64" height="6" rx="3" fill="#3E5C76"/><rect x="40" y="140" width="7" height="66" rx="3" fill="#3E5C76"/><text x="62" y="164" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">Coaches can help teachers and also</text><text x="62" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">build leadership capacity in their</text><rect x="40" y="230" width="7" height="66" rx="3" fill="#3E5C76"/><text x="62" y="254" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">Top-down hierarchies and competing</text><text x="62" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">reforms can get in the way</text><rect x="40" y="320" width="7" height="66" rx="3" fill="#3E5C76"/><text x="62" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">Key question: what skills coaches</text><text x="62" y="380" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#1F2421">need to do both</text></svg>