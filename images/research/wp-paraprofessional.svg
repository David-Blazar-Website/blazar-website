<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#E6ECE4"/><text x="48" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#4F6B52">TEACHER PIPELINE</text><text x="44" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#4F6B52">1 in 3–4</text><text x="48" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">Schools lose roughly one aide position for</text><text x="48" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">every three to four aides who become teachers</text></svg>