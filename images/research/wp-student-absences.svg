<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img"><rect width="800" height="500" fill="#E6EAF1"/><text x="48" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#4A5D7A">STUDENT ATTENDANCE</text><text x="44" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-weight="700" fill="#4A5D7A">≈40% smaller</text><text x="48" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">Drop after the pandemic in the effect of</text><text x="48" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">tenth-grade absences on high school graduation</text><text x="48" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">in Maryland. Effects on test scores shrank</text><text x="48" y="434" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" fill="#1F2421">only 5–20%.</text></svg>